[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ialauncher"
version = "3.0.0"
description = "A DOSBox frontend for the Internet Archive"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jaap Joris Vens", email = "ialauncher@jj.rtts.eu" }]
requires-python = ">=3.12"
dependencies = ["pygame-ce"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://ialauncher.created.today/"

[project.scripts]
ialauncher = "ialauncher.__main__:main"

[tool.hatch.build]
include = [
    "/ialauncher",
    "/games/__init__.py",
    "/games/*/metadata.ini",
    "/games/*/title.png",
    "/games/*/patches/*",
]

[tool.ruff]
extend-exclude = ["windows"]
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "PT", "T201", "FIX002", "TD003"]

[tool.ruff.lint.per-file-ignores]
"games/*/patches/*.py" = ["INP001"]  # standalone scripts, not modules

[tool.ty.src]
exclude = ["windows"]
