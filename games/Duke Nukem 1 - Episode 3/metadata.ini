[metadata]
title = Duke Nukem 1: Episode 3
year = 1991
url = https://cors.archive.org/cors/DN3DREG/DN3D_REG.iso
size = 104138752
core = normal
cpu_cycles = 3000
cpu_cycles_protected = n/a
emulator_start = 
	if exist duke3 goto run
	md duke3
	mount d "DN3D_REG.iso" -t iso
	d:
	cd dn1inst
	copy *.* c:\duke3
	:run
	cd duke3
	duke3
autoplay = 0

