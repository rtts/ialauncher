[metadata]
title = Doom 2
year = 1994
url = https://cors.archive.org/cors/Doom_II_1994_id_Software/Doom%20II%20%281994%29%28id%20Software%29.iso
size = 23541760
emulator_start = 
	if exist doom2 goto run
	mount d "Doom II (1994)(id Software).iso" -t iso
	d:
	autotype -w 0.5 c enter y
	deice
       	config -set cpu_cycles=max
	doom2g
	del doom2g.exe
	autotype enter enter enter enter enter enter enter down down down down down enter esc enter
	setup
	:run
	cd\doom2
	doom2

