[metadata]
title = Doom 2: TNT Evilution
year = 1996
url = https://cors.archive.org/cors/FINALDOOM/FINALDOOM.ISO
size = 68237312
core = dynamic
cpu_cycles = 100000
cpu_cycles_protected = auto
emulator_start = 
	mixer opl 300 /noshow
	if exist tnt goto run
	mount d "FINALDOOM.ISO" -t iso
	d:
	cd tnt
	autotype -w 0.5 c enter y
	deice
	resource
	del resource.exe
	autotype enter enter enter enter enter enter enter down down down down down enter esc enter
	setup
	:run
	cd\tnt
	doom2
autoplay = 264

