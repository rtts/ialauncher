[metadata]
title = Carmageddon
year = 1997
url = https://archive.org/download/Carmageddon/Carmageddon.cue
	https://archive.org/download/Carmageddon/Carmageddon.bin
emulator_start = 
	@echo off
	imgmount d CARMAG~2.CUE -t iso
	if exist D:\CARMA.EXE goto install
	cls
	echo The upstream CUE file is slightly broken. Open it in your editor and fix it!
	pause
	goto end
	:install
	if exist GAMES goto run
	d:
	MOREINST
	SNDSETUP
	:run
	cd \GAMES\CARMA
	cls
	echo The "vertical bars" bug has been fixed in DOSBox Staging!
	pause
	CARMA
	:end

