[metadata]
title = Carmageddon
year = 1997
video = vga
cdrom = yes
url = https://cors.archive.org/cors/Carmageddon/Carmageddon.cue
	https://cors.archive.org/cors/Carmageddon/Carmageddon.bin
emulator_start = 
	imgmount d "Carmageddon.cue" -t iso
	if exist d:\carma.exe goto install
	cls
	echo The upstream CUE file is slightly broken. Open it in your editor and fix it!
	pause
	goto end
	:install
	if exist games goto run
	d:
	moreinst
	sndsetup
	:run
	cd \games\carma
	cls
	echo The "vertical bars" bug has been fixed in DOSBox Staging!
	pause
	carma
	:end

