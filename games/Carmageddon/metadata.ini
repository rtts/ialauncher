[metadata]
title = Carmageddon
year = 1997
url = https://cors.archive.org/cors/Carmageddon/Carmageddon.cue
	https://cors.archive.org/cors/Carmageddon/Carmageddon.bin
size = 755375875
core = dynamic
cpu_cycles = 100000
cpu_cycles_protected = auto
emulator_start = 
	mount d "Carmageddon.cue" -t iso
	if exist games goto run
	d:
	autotype enter enter enter enter right enter
	moreinst
	autotype enter enter enter right right enter up up enter enter
	sndsetup
	:run
	cd \games\carma
	rem Note there also exists carma -hires, but it needs more memory.
	carma
autoplay = 152

