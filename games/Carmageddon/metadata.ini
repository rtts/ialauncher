[metadata]
title = Carmageddon
year = 1997
url = https://cors.archive.org/cors/Carmageddon/Carmageddon.cue
	https://cors.archive.org/cors/Carmageddon/Carmageddon.bin
size = 755375881
emulator_start = 
	mount d "Carmageddon.cue" -t iso
	if exist d:\carma.exe goto install
	cls
	echo The upstream CUE file is slightly broken, containing a
	echo superfluous directory name ("cdrom/")
	echo.
	echo Please open Carmadeddon.cue in your editor and fix it.
	echo.
	pause
	goto end
	:install
	if exist games goto run
	d:
	moreinst
	cls
	echo Be very careful how you configure sound next!
	echo The game will crash spectacularly if done wrong.
	echo.
	echo Values that worked for me were:
	echo - Digital: SB16, port 220, IRQ 7, DMA 1
	echo - MIDI: MPU-401
	echo.
	pause
	sndsetup
	:run
	cd \games\carma
	cls
	echo The "vertical bars" bug has been fixed in DOSBox Staging!
	echo.
	pause
	carma
	:end

