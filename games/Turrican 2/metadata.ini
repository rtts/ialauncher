[metadata]
url = https://archive.org/download/Redump.org2053/Turrican%20II%20-%20The%20Final%20Fight%20%28Europe%29.7z
title = Turrican 2
emulator_start = 
	imgmount d "Turrican II - The Final Fight (Europe).cue" -t iso
	if exist d:\setup.exe goto ok
	echo.
	echo Please unpack the 7z file in the "dosbox_drive_c" folder manually.
	echo.
	pause
	goto end
	:ok
	if exist turrican goto run
	cls
	echo In the installation program, choose option 4 followed again by option 4.
	echo Then proceed to install Turrican to the hard drive. Use the default location.
	echo.
	pause
	d:
	setup
	copy turrican.cfg \turrican.cfg\
	:run
	cd \turrican
	cls
	echo Good news! You can fix the sound by choosing SoundBlaster 16 with DMA 5!
	echo (instead of the the default of 1)
	echo.
	pause
	oversmpl on
	turrican
	:end
