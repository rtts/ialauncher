[metadata]
title = Magic Carpet 2
year = 1995
video = vga
cdrom = yes
url = https://cors.archive.org/cors/msdos_Magic_Carpet_2_-_The_Netherworlds_1995/Magic_Carpet_2_-_The_Netherworlds_1995.zip
emulator_start = 
	cd magcarp2
	imgmount d "MagCarp2/cd/Magic Carpet 2.cue" -t iso
	cd netherw
	cd sound
	del mdi.ini
	copy sb16\*.* .
	cd ..
	cd ..
	echo.
	echo Pressing "r" during gameplay will turn on Hi-Res mode, however the game will run
	echo incredibly slow unless you increase the speed of DOSBox by pressing CTRL-F12.
	echo.
	pause
	d:
	netherw

