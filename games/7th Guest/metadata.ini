[metadata]
title = The 7th Guest
year = 1993
url = https://cors.archive.org/cors/The_7th_Guest_-_MSDOS_Eng/The_7Th_Guest_Cd1.iso
	https://cors.archive.org/cors/The_7th_Guest_-_MSDOS_Eng/The_7Th_Guest_Cd2.iso
size = 970946560
emulator_start = 
	config -set cpu_cycles=max
	if exist id goto run
	mount d "The_7Th_Guest_Cd2.iso" -t iso
	d:
	cd t7g\install
	autotype enter enter enter enter enter enter enter enter
	install
	mount -u d
	:run
	mount d "The_7Th_Guest_Cd1.iso" -t iso
	cd id\t7g
	mixer opl 200 sb 200
	call t7gdemo
intro = yes

