[metadata]
title = The 7th Guest
year = 1993
url = https://archive.org/download/The_7th_Guest_-_MSDOS_Eng/The_7Th_Guest_Cd1.iso
	https://archive.org/download/The_7th_Guest_-_MSDOS_Eng/The_7Th_Guest_Cd2.iso
emulator_start = 
	if exist id goto run
	imgmount d "The_7Th_Guest_Cd2.iso" -t iso
	d:
	cd t7g\install
	install
	imgmount -u d
	:run
	imgmount d "The_7Th_Guest_Cd1.iso" -t iso
	cd id\t7g
	t7g

