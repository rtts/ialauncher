[metadata]
title = Quake: Mission Pack No. 1
year = 1996
video = vga
cdrom = yes
url = https://cors.archive.org/cors/QuakeGtInteractive/Quake.cue
	https://cors.archive.org/cors/QuakeGtInteractive/Quake.bin
	https://cors.archive.org/cors/QuakeMissionPackNo.1ScourgeOfArmagonUSA/Quake%20Mission%20Pack%20No.%201%20-%20Scourge%20of%20Armagon%20%28USA%29.zip
emulator_start = 
	imgmount d "Quake.cue" -t iso
	if exist quake goto next
	d:
	install
	:next
	if exist quake\armagon.bat goto run
	imgmount e "Quake Mission Pack No. 1 - Scourge of Armagon (USA).cue" -t iso
	e:
	cd dos
	install
	:run
	cd quake
	armagon

