[metadata]
title = Warcraft 2: Tides of Darkness
year = 1995
video = vga
cdrom = yes
url = https://cors.archive.org/cors/msdos_Warcraft_II_-_Tides_of_Darkness_1995/Warcraft_II_-_Tides_of_Darkness_1995.zip
emulator_start = 
	cd warcrafd
	imgmount d "WarcrafD/cd/WC2TOD.cue" "WarcrafD/cd/WC2BTDP.cue" -t iso
	echo.
	echo If prompted to switch to the expansion campaign disk
	echo (Beyond the Dark Portal) press Ctrl-F4
	echo.
	pause
	del war2.ini
	copy sb16\*.* .
	cd drivers
	del mdi.ini
	copy sb16\*.* .
	cd ..
	war2

