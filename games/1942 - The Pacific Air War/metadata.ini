emulator_start = 
	config -set cpu_cycles=60000
	if exist mps\1942\1942.exe goto run
	mount a "1942 - The Pacific Air War (1994) (MicroProse Software, Inc.) (1.44M) (Disk 1).ima" -t floppy
	copy a:\1942.001
	copy a:\pkunzjr.com
	mount -u a
	mount a "1942 - The Pacific Air War (1994) (MicroProse Software, Inc.) (1.44M) (Disk 2).ima" -t floppy
	copy a:\1942.002
	mount -u a
	mount a "1942 - The Pacific Air War (1994) (MicroProse Software, Inc.) (1.44M) (Disk 3).ima" -t floppy
	copy a:\1942.003
	mount -u a
	mount a "1942 - The Pacific Air War (1994) (MicroProse Software, Inc.) (1.44M) (Disk 4).ima" -t floppy
	copy a:\1942.004
	mount -u a
	mount a "1942 - The Pacific Air War (1994) (MicroProse Software, Inc.) (1.44M) (Disk 5).ima" -t floppy
	copy a:\1942.005
	mount -u a
	mount a "1942 - The Pacific Air War (1994) (MicroProse Software, Inc.) (1.44M) (Disk 6).ima" -t floppy
	copy a:\1942.006
	mount -u a
	copy 1942.001+1942.002+1942.003+1942.004+1942.005+1942.006+1942.cd 1942.zip
	del 1942.00?
	md mps
	md mps\1942
	cd mps\1942
	c:\pkunzjr c:\1942.zip
	md missions
	move 1942 missions
	copy c:\config.ft
	del c:\1942.zip
	del c:\pkunzjr.com
	:run
	cd \mps\1942
	1942
autoplay = 124

