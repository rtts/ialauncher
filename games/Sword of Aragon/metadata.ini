[metadata]
title = Sword of Aragon
year = 1989
video = ega
url = https://cors.archive.org/cors/msdos_Sword_of_Aragon_1989/Sword_of_Aragon_1989.zip
emulator_start = 
	cd swordofa
	echo.
	echo This crack is a bit odd.  When prompted to type a word
	echo from the poster, just type the word in capital letters on
	echo the line.  The prompt will look something like:
	echo Type the first word from: LOCATION>
	echo.
	echo In which case you type "location"
	echo.
	pause
	sword

