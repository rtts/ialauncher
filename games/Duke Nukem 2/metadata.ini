[metadata]
title = Duke Nukem 2
year = 1993
url = https://cors.archive.org/cors/DN3DREG/DN3D_REG.iso
size = 104138752
core = dynamic
cpu_cycles = 25000
cpu_cycles_protected = n/a
emulator_start = 
	if exist nukem2 goto run
	md nukem2
	mount d "DN3D_REG.iso" -t iso
	d:
	cd dn2inst
	copy *.* c:\nukem2
	:run
	cd nukem2
	autotype -w 5 space
	nukem2
autoplay = 544

