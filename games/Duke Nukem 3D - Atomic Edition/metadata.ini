title = Duke Nukem 3D: Atomic Edition
year = 1996
url = https://cors.archive.org/cors/msdos_Duke_Nukem_3D_-_Atomic_Edition_1996/Duke_Nukem_3D_-_Atomic_Edition_1996.zip
