emulator_start = 
	cd duke3dat
	mount d "Duke3DAt/cd/KillATonCollection CD1.iso" -t iso
	cd duke3d
	copy sb16\*.* .
	config -set sbmixer=off
	config -set cpu_cycles=max
	duke3d

