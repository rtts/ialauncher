[metadata]
title = D-Generation
year = 1991
url = https://cors.archive.org/cors/D-Generation_-_MS-DOS_Game_-_MinscapeEng/DGENERATION.iso
size = 2406400
core = dynamic
cpu_cycles = 25000
cpu_cycles_protected = n/a
emulator_start = 
	mount d "DGENERATION.iso" -t iso
	if exist dgen goto run
	d:
	autotype enter enter
	install
	:run
	cd\dgen
	dgen
autoplay = 172

