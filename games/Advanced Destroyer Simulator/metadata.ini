title = Advanced Destroyer Simulator
year = 1990
url = https://cors.archive.org/cors/msdos_Advanced_Destroyer_Simulator_1990/Advanced_Destroyer_Simulator_1990.zip
size = 276773
core = normal
cpu_cycles = 12000
