emulator_start = 
	cd advdsim
	rem When using Adlib, this game speeds up the timer and, on every tick,
	rem writes the next byte of an 8-bit PCM buffer to port 389h, using
	rem AdLib's volume register as a crude sample player :mindblown:
	autotype f3 f3
	\holdkeys
	ads
autoplay = 134

