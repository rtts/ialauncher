[metadata]
title = Doom 2: The Plutonia Experiment 2
year = 1996
video = vga
cdrom = yes
url = https://cors.archive.org/cors/FINALDOOM/FINALDOOM.ISO
	ftp://ftp.fu-berlin.de/pc/games/idgames/levels/doom2/megawads/pl2.zip
emulator_start = 
	imgmount d "FINALDOOM.ISO" -t iso
	if exist plutonia goto run
	md plutonia
	copy pl2.wad plutonia
	d:
	cd plutonia
	install
	goto end
	:run
	cd plutonia
	doom2 -file pl2.wad
	:end

