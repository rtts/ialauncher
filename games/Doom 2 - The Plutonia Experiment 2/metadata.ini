[metadata]
title = Doom 2: The Plutonia Experiment 2
year = 2008
url = https://cors.archive.org/cors/FINALDOOM/FINALDOOM.ISO
	ftp://ftp.fu-berlin.de/pc/games/idgames/levels/doom2/megawads/pl2.zip
	https://www.quaddicted.com/files/idgames/themes/TeamTNT/boom/boom202.zip
size = 74471407
core = dynamic
cpu_cycles = 100000
cpu_cycles_protected = auto
emulator_start = 
	sbmixer off
	mixer opl 200 /noshow
	mount d "FINALDOOM.ISO" -t iso
	if exist plutonia goto run
	d:
	cd plutonia
	autotype -w 0.5 c enter y
	deice
	resource
	del resource.exe
	:run
	if exist \boom.cfg goto boom
	echo usegamma 0 > \boom.cfg
	:boom
	cd\plutonia
	\boom -file \pl2.wad -deh \pl2.deh
autoplay = 110

