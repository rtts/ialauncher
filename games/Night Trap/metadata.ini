[metadata]
title = Night Trap
year = 1992
video = vga
cdrom = yes
url = https://cors.archive.org/cors/msdos_Night_Trap_1994/Night_Trap_1994.zip
emulator_start = 
	imgmount d "ntrap/cd/NIGHT_TRAP1.iso" "ntrap/cd/NIGHT_TRAP2.iso" -t iso
	echo.
	echo This game spans 2 CDs. Press Ctrl+F4 when prompted to switch to the next disc.
	echo.
	pause
	d:
	nt

