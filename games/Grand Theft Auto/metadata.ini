[metadata]
title = Grand Theft Auto
year = 1997
url = https://cors.archive.org/cors/grandtheftauto1997/GRAND.cue
	https://cors.archive.org/cors/grandtheftauto1997/GRAND.bin
size = 755178289
core = dynamic
cpu_cycles = 60000
cpu_cycles_protected = auto
emulator_start = 
	mount d GRAND.cue -t iso > nul
	if exist gtados\gta24.exe goto run
	md gtados
	md gtados\data
	md gtadata
	md gtadata\audio
	copy d:\gtados\*.* gtados > nul
	copy d:\gtados\data\*.* gtados\data > nul
	copy d:\gtadata\*.* gtadata > nul
	copy d:\gtadata\audio\*.* gtadata\audio > nul
	copy dig.ini gtados > nul
	:run
	cd gtados
	gta24 -nounivbe
autoplay = 429

