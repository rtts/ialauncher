[metadata]
title = Theme Park
year = 1994
video = vga
cdrom = yes
url = https://cors.archive.org/cors/msdos_Theme_Park_1994/Theme_Park_1994.zip
emulator_start = 
	cd thempark
	imgmount d "ThemPark/cd/themepark.iso" -t iso
	d:
	cd game
	intro -c:/thempark/theme.cd
	main -cd:/game/ -dc:/thempark/theme.cd/ -10

