[metadata]
title = Doom 1: Sigil
year = 2019
url = https://cors.archive.org/cors/DOOMSE/DOOM_SE.ISO
	https://romero.com/s/SIGIL_v1_21.zip
	https://www.quaddicted.com/files/idgames/themes/TeamTNT/boom/boom202.zip
size = 27520755
emulator_start = 
	if exist doom.wad goto next
	mount d "DOOM_SE.ISO" -t iso
	copy d:\doomcd\doom.wad doom.wad
	:next
	if exist sigil.wad goto run
	cd sigil_~1
	rem We need the "compat" WAD, but there's no way to tell them
	rem apart with 8.3 filenames. Thanks, Romero!
	\pickwad
	cd\
	:run
	rem Boom attempts to manipulate the SB16's mixer volume, badly.
	config -set sbmixer=off
	boom -file sigil.wad

