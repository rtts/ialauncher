[metadata]
title = 3D Body Adventure
year = 1994
url = https://cors.archive.org/cors/Various_DOS_Abandonware_Ark/3d%20Body%20Adventure%20%281994%29%28Knowledge%20Adventure%20Levande%20Bocker%29.zip
size = 5730400
emulator_start = 
	config -set cpu_cycles=25000
	if exist 3dbody\ka.com goto run
	md 3dbody
	cd 3dbody
	call c:\unpack.bat
	copy c:\ka.cnf
	copy ka.adl ka.mus
	:run
	cd \3dbody
	ka -520k kav.pgm -lC:\3DBODY -rC:\3DBODY -fC:\3DBODY
autoplay = 115

