[metadata]
title = Tornado: Operation Desert Storm
year = 1994
video = vga
cdrom = yes
url = https://cors.archive.org/cors/msdos_Tornado_Operation_Desert_Storm_1994/Tornado_Operation_Desert_Storm_1994.zip
emulator_start = 
