[metadata]
title = Reunion
year = 1994
url = https://cors.archive.org/cors/msdos_Reunion_1994/Reunion_1994.zip
size = 92679798
emulator_start = 
	cd reunion
	mount d "Reunion/cd/Reunion.iso" -t iso
	cd reunion.eng
	del save\setup.spd
	copy save\setup.sb save\setup.spd
	cd ..
	config -set sbbase=220
	config -set gusbase=240
	d:
	call start

