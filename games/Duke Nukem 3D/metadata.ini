[metadata]
title = Duke Nukem 3D
year = 1996
url = https://cors.archive.org/cors/DN3DREG/DN3D_REG.iso
size = 104138752
emulator_start = 
	if exist duke3d goto run
	md duke3d
	mount d "DN3D_REG.iso" -t iso
	d:
	cd dn3dinst
	copy *.* c:\duke3d
	c:
	cd duke3d
	autotype enter enter down down enter enter enter down enter enter down down enter down enter down down enter esc esc enter
	setup
	:run
	cd duke3d
	config -set sbmixer=off
	duke3d

