[metadata]
title = Duke Nukem 3D
year = 1996
video = vga
cdrom = yes
url = https://cors.archive.org/cors/DN3DREG/DN3D_REG.iso
emulator_start = 
	if exist duke3d goto run
	md duke3d
	imgmount d "DN3D_REG.iso" -t iso
	d:
	cd dn3dinst
	copy *.* c:\duke3d
	c:
	cd duke3d
	setup
	:run
	cd duke3d
	duke3d

