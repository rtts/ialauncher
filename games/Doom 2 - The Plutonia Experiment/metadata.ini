[metadata]
title = Doom 2: The Plutonia Experiment
year = 1996
video = vga
cdrom = yes
url = https://cors.archive.org/cors/FINALDOOM/FINALDOOM.ISO
emulator_start = 
	imgmount d "FINALDOOM.ISO" -t iso
	if exist plutonia goto run
	d:
	cd plutonia
	install
	goto end
	:run
	cd plutonia
	doom2 -warp 32
	:end

