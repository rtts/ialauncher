[metadata]
title = Space Crusade
year = 1992
video = vga
cdrom = yes
url = https://cors.archive.org/cors/msdos_Space_Crusade_1992/Space_Crusade_1992.zip
emulator_start = 
	imgmount d "SpaceCru/cd/SPACE.cue" -t iso
	cd spacecru
	del space.cfg
	copy sb16\*.* .
	cls
	echo With this game, DOSBox will not capture the mouse
	echo when clicking on the DOSBox window,
	echo to capture the mouse, press Ctrl+F10.
	pause
	crusade

