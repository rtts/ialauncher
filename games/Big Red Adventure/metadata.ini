[metadata]
title = Big Red Adventure
year = 1995
url = https://cors.archive.org/cors/msdos_Big_Red_Adventure_1995/Big_Red_Adventure_1995.zip
size = 448550277
core = dynamic
cpu_cycles = 25000
cpu_cycles_protected = auto
root = bigred
emulator_start = 
	rem The MIDI driver divides by zero and the SB driver plays random
	rem memory, so both need fixes. Thanks, Marco Tabini and Paolo Rosi,
	rem who are credited for the music and sound drivers.
	mount d "CD/BIGREDADVNTRE.cue" -t iso
	copy d:\adv.exe
	copy d:\sbmidi.exe
	copy d:\sbeff.exe
	introfix
	midifix
	sbfix
	sbmidi
	sbeff
	d:
	mdrv
	c:\adv -l0 -cC:\BIGRED -dD
autoplay = 171

