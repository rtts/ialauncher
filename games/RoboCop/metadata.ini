[metadata]
title = RoboCop
year = 1988
url = https://cors.archive.org/cors/msdos_RoboCop_1989/RoboCop_1989.zip
size = 822738
# SOUND.IBM (packed inside FILES.A and FILES.B) calibrates a speed factor
# (f = cycles / ~267) that underflows for f >= 9, turning short noise bursts
# into long ones that freeze the screen (~2400-3500 cycles). Above ~3500 its
# counter overflows and f falls back to 1, like on a real PC/XT.
dosbox_conf =
	[cpu]
	cycles=fixed 4000
emulator_start = 
	cd RoboCop
	robocop

