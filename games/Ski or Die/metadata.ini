[metadata]
title = Ski or Die
year = 1990
url = https://cors.archive.org/cors/msdos_Ski_or_Die_1990/Ski_or_Die_1990.zip
size = 455358
emulator_start = 
	cd skiordie
	echo 1. PC speaker
	echo 2. AdLib
	echo 3. MT-32
	choice /c:123 /n Your choice:
	if errorlevel 3 goto mt32
	if errorlevel 2 goto adlib
	ski
	goto end
	:adlib
	ski adlib
	goto end
	:mt32
	ski mt32
	:end

