[metadata]
title = Tomb Raider
year = 1996
video = vga
cdrom = yes
url = https://cors.archive.org/cors/tomb_raider_1996/tomb_raider.zip
emulator_start = 
	@echo off
	mount d TOMBENG -t cdrom
	if exist d:\autorun.inf goto run
	echo Oops, something went wrong!
	pause
	goto end
	:run
	cd tombraid
	tomb
	:end

