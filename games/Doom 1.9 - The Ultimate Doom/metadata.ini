[metadata]
title = Doom 1: The Ultimate Doom
year = 1995
url = https://cors.archive.org/cors/DOOMSE/DOOM_SE.ISO
size = 23410688
core = dynamic
cpu_cycles = 100000
cpu_cycles_protected = auto
emulator_start = 
	mixer opl 300 /noshow
	if exist doom_se goto run
	mount d "DOOM_SE.ISO" -t iso
	d:
	autotype -w 0.5 c enter y
	deice
	doom_se
	del doom_se.exe
	autotype enter enter enter enter enter enter enter down down down down down enter esc enter
	setup
	:run
	cd\doom_se
	doom
autoplay = 281

