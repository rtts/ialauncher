[metadata]
title = O-Pong
year = 1996
video = vga
url = https://cors.archive.org/cors/msdos_OPong_1996/OPong_1996.zip
emulator_start = 
	cd opong
	echo.
	echo This game requires sound settings each time it starts. DOSBox has been
	echo set to the defaults:
	echo Address Port: 220h
	echo Interrupt: 5
	echo DMA: 1
	echo.
	pause
	pong

