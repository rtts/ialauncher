[metadata]
title = Doom 0.99: Shareware version
year = 1993
url = ftp://ftp.fu-berlin.de/pc/games/idgames/historic/doom1_0.zip
size = 2164729
emulator_start = 
	if exist doom goto run
	config -set cpu_cycles=max
	autotype -w 0.5 c enter y
	deice
	config -set cpu_cycles=max
	doom1_0
	del doom1_0.exe
	autotype enter enter enter enter enter enter enter down enter esc enter
	setup
	:run
	cd\doom
	doom

