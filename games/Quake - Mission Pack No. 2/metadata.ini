[metadata]
title = Quake: Mission Pack No. 2
year = 1996
video = vga
cdrom = yes
url = https://cors.archive.org/cors/QuakeGtInteractive/Quake.cue
	https://cors.archive.org/cors/QuakeGtInteractive/Quake.bin
	https://cors.archive.org/cors/QuakeMissionPackNo.2DissolutionOfEternityUSA/Quake%20Mission%20Pack%20No.%202%20-%20Dissolution%20of%20Eternity%20%28USA%29.zip
emulator_start = 
	imgmount d "Quake.cue" -t iso
	if exist quake goto next
	d:
	install
	:next
	if exist quake\rogue goto run
	imgmount e "Quake Mission Pack No. 2 - Dissolution of Eternity (USA).cue" -t iso
	e:
	cd dos
	install
	:run
	cd quake
	quake -rogue

