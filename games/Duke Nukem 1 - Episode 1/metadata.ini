[metadata]
title = Duke Nukem 1: Episode 1
year = 1991
url = https://cors.archive.org/cors/DN3DREG/DN3D_REG.iso
size = 104138752
core = normal
cpu_cycles = 3000
cpu_cycles_protected = n/a
emulator_start = 
	if exist duke1 goto run
	md duke1
	mount d "DN3D_REG.iso" -t iso
	d:
	cd dn1inst
	copy *.* c:\duke1
	:run
	cd duke1
	\intro
	duke1
autoplay = 28

