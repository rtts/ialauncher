[metadata]
title = Doom 2: Master Levels for Doom 2
year = 1995
url = https://cors.archive.org/cors/Doom_II_1994_id_Software/Doom%20II%20%281994%29%28id%20Software%29.iso
	https://cors.archive.org/cors/Various_DOS_Abandonware_Ark/Master%20Levels%20For%20Doom%20II%20%281995%29%28Id%20Software%29.zip
size = 25012800
emulator_start = 
	if exist doom2 goto next
	mount d "Doom II (1994)(id Software).iso" -t iso
	d:
	autotype -w 0.5 c enter y
	deice
	config -set cpu_cycles=max
	doom2g
	del doom2g.exe
	autotype enter enter enter enter enter enter enter down down down down down enter esc enter
	setup
	cd\
	:next
	if exist master goto run
	autotype -w 0.5 c enter y
	deice
	config -set cpu_cycles=max
	master
	del master.exe
	md wads
	move *.wad wads > nul
	move *.txt wads > nul
	:run
	cd\master
	autotype enter enter enter
	doomit doom2

