repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix, --unsafe-fixes]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.89
    hooks:
      - id: ty
        args: [--isolated]
  - repo: local
    hooks:
      - id: unittest
        name: unittest
        entry: python -m unittest
        language: python
        additional_dependencies: [pygame-ce]
        always_run: true
        pass_filenames: false
      - id: tabs
        name: tabs
        entry: 'sed -i -E "s/ {8}/\t/g"'
        language: system
        files: (^|/)metadata\.ini$
