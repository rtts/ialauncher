repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix, --unsafe-fixes]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.89
    hooks:
      - id: ty
        args: [--isolated]
  - repo: local
    hooks:
      - id: unittest
        name: unittest
        entry: python -m unittest
        language: python
        additional_dependencies: [pygame-ce]
        types: [python]
        pass_filenames: false
      - id: tabs
        name: tabs
        entry: python -c "import pathlib, sys; [p.write_bytes(new) for p in map(pathlib.Path, sys.argv[1:]) if (new := p.read_bytes().replace(bytes(8 * [32]), bytes([9]))) != p.read_bytes()]"
        language: python
        files: (^|/)metadata\.ini$
