repos:
  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies: [pygame-ce]
        exclude: ^windows/setup_win\.py$
